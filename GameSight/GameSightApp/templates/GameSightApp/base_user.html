<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GameSight{% endblock %}</title>

<style>
:root {
    color-scheme: dark;
    --bg: #080d18;
    --panel: #111a2b;
    --border: #24304b;
    --muted: #9babcc;
    --blue: #4384ff;
    --purple: #8958f7;
    --good: #35d3a0;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background:
        radial-gradient(
            ellipse at 78% -10%,
            #15264c 0,
            transparent 48%
        ),
        var(--bg);
    color: #edf3ff;
    font: 15px system-ui, Segoe UI, Arial, sans-serif;
}

.layout {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 228px;
    flex-shrink: 0;
    background: #090f1b;
    border-right: 1px solid var(--border);
    padding: 26px 16px;
    display: flex;
    flex-direction: column;
}

.brand {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 38px;
}

.brand small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0;
    margin-top: 3px;
}

.nav-label {
    color: #7185ae;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 18px 10px 10px;
}

.nav a {
    display: block;
    color: #cbd8f5;
    padding: 13px 15px;
    border-radius: 12px;
    text-decoration: none;
    margin: 3px 0;
}

.nav a:hover,
.nav a.active {
    background:
        linear-gradient(95deg, #19488d, #332c73);
    color: white;
}

.footer {
    margin-top: auto;
    color: var(--muted);
    font-size: 12px;
    padding: 20px 10px;
}

.main {
    flex: 1;
    min-width: 0;
    padding: 32px 36px;
}

.head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

h1 {
    font-size: 30px;
    letter-spacing: -.8px;
    margin: 0 0 5px;
}

h2 {
    margin: 0 0 12px;
    font-size: 19px;
}

.sub {
    color: var(--muted);
    margin: 0 0 20px;
    line-height: 1.55;
}

.panel {
    background:
        linear-gradient(155deg, #121b2d, #0d1423);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 23px;
    min-width: 0;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #182642;
    border: 1px solid #344564;
    color: white;
    text-decoration: none;
    font-weight: 650;
    border-radius: 12px;
    padding: 12px 17px;
    cursor: pointer;
}

.btn.primary {
    background:
        linear-gradient(
            100deg,
            var(--blue),
            var(--purple)
        );
    border: 0;
}

.btn:hover { filter: brightness(1.15); }

label {
    display: block;
    margin: 16px 0 7px;
    color: #aebfe1;
    font-size: 13px;
}

input, select {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1px solid #2a3855;
    border-radius: 11px;
    background: #0b1220;
    color: white;
    font: inherit;
}

.form-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    gap: 0 18px;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(235px, 1fr));
    gap: 16px;
}

.score {
    font-size: 42px;
    font-weight: 850;
    letter-spacing: -2px;
    color: #5b97ff;
}

.muted { color: var(--muted); }

.tag {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 50px;
    background: #183154;
    color: #b4ceff;
    font-size: 12px;
}

.high { color: #36d1a5; }
.medium { color: #ffbf64; }
.low { color: #ff7d90; }

.bar {
    height: 12px;
    background: #27334d;
    border-radius: 20px;
    overflow: hidden;
    margin: 10px 0;
}

.bar span {
    display: block;
    height: 100%;
    background:
        linear-gradient(90deg, #3c88ff, #8957ff);
    border-radius: 20px;
}

.grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
}

.list {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    text-align: left;
    border-bottom: 1px solid var(--border);
    padding: 11px 8px;
}

th {
    font-size: 12px;
    color: var(--muted);
}

.error {
    padding: 12px;
    border: 1px solid #b54d61;
    background: #40212a;
    border-radius: 10px;
}

small { color: var(--muted); }

@media(max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; padding: 14px; }
    .brand { margin-bottom: 5px; }
    .nav { display: flex; gap: 7px; flex-wrap: wrap; }
    .nav-label, .footer { display: none; }
    .main { padding: 22px 14px; }
    .grid2, .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            ✦ GameSight
            <small>Data-driven game insights</small>
        </div>

        <div class="nav-label">Principal</div>

        <nav class="nav">
            <a href="/">⌂ Inicio</a>

            <a
                href="{% url 'dashboard_usuario' %}"
                class="{% if request.resolver_match.url_name == 'dashboard_usuario' %}active{% endif %}">
                ▣ Mi videojuego
            </a>
        </nav>

        <div class="nav-label">Mi cuenta</div>

        <nav class="nav">
            <a
                href="{% url 'gamesight_historial' %}"
                class="{% if request.resolver_match.url_name == 'gamesight_historial' %}active{% endif %}">
                ◷ Historial
            </a>

            <a
                href="{% url 'gamesight_favoritos' %}"
                class="{% if request.resolver_match.url_name == 'gamesight_favoritos' %}active{% endif %}">
                ♡ Favoritos
            </a>
        </nav>

        <div class="footer">
            GameSight · Proyecto académico
        </div>
    </aside>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

</div>
</body>
</html>
